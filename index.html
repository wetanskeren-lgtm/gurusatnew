</div>
<div id="modalOverlay" class="modal-overlay hidden" onclick="if(event.target===this)closeModal()"><div class="modal-content" id="modalBody"></div></div>

<script>
var gData=null,activeClass='',_cachedTokens=null,_cachedSiswa=null;

/* ===== SISTEM KUNCI FITUR GURU ===== */
var _featureLocks={};   /* cache: { featureId: boolean } */
var _globalLocks={};    /* cache: { featureId: boolean } */
var _lockLoaded=false;
var _lockListenerReg=false;

/* Mapping halaman guru → ID fitur di admin */
var PAGE_TO_FEATURE={
  'bank-soal':'access_soal',
  'kelola-tp':'access_tp',
  'print-soal':'print_soal',
  'print-kisi':'print_kisi',
  'print-kunci':'print_kunci',
  'pensekoran':'pensekoran',
  'data-siswa':'access_siswa'
};

/* Halaman yang butuh akses tulis (bukan cuma baca) */
var WRITE_FEATURES={
  'kelola-tp':'create_tp',
  'data-siswa':'manage_siswa',
  'token':null,
  'kartu-login':null,
  'koreksi':null,
  'cetak-nilai':null,
  'pensekoran':null
};

function loadFeatureLocks(){
  if(!gData||!gData._id)return Promise.resolve();
  var db=getDB(activeClass);if(!db)return Promise.resolve();
  return Promise.all([
    db.collection('globalLocks').doc('features').get(),
    db.collection('featureLocks').doc(gData._id).get()
  ]).then(function(results){
    _globalLocks=results[0].exists?results[0].data():{};
    _featureLocks=results[1].exists?results[1].data():{};
    _lockLoaded=true;
    applyLocksToSidebar();
  }).catch(function(){
    _globalLocks={};_featureLocks={};_lockLoaded=true;applyLocksToSidebar();
  });
}

function isFeatureLocked(featureId){
  if(!featureId)return false;
  /* Prioritas: Global > Per Guru */
  if(_globalLocks[featureId]===true)return true;
  if(_featureLocks[featureId]===true)return true;
  return false;
}

function isPageLocked(page){
  /* Cek akses baca */
  var readFeat=PAGE_TO_FEATURE[page];
  if(readFeat && isFeatureLocked(readFeat))return 'read';
  /* Cek akses tulis */
  var writeFeat=WRITE_FEATURES[page];
  if(writeFeat!==undefined && writeFeat && isFeatureLocked(writeFeat))return 'write';
  return false;
}

function applyLocksToSidebar(){
  var items=document.querySelectorAll('#sidebarNav .nav-item');
  items.forEach(function(item){
    var page=item.getAttribute('data-page');
    if(!page||page==='dashboard')return;
    var lockType=isPageLocked(page);
    if(lockType==='read'){
      item.classList.add('locked-item');
    }else{
      item.classList.remove('locked-item');
    }
  });
}

function getLockBannerHTML(page, lockType){
  if(lockType==='read'){
    return '<div class="locked-banner no-print"><i class="fas fa-lock"></i><div class="lb-text"><div class="lb-title">Fitur Dikunci oleh Admin</div><div class="lb-desc">Halaman ini tidak dapat diakses. Hubungi administrator untuk membuka akses.</div></div></div>';
  }
  if(lockType==='write'){
    return '<div class="locked-banner no-print"><i class="fas fa-pen-slash"></i><div class="lb-text"><div class="lb-title">Akses Tulis Dikunci</div><div class="lb-desc">Anda dapat melihat data namun tidak dapat menambah, mengubah, atau menghapus. Hubungi administrator.</div></div></div>';
  }
  return '';
}

/* ===== UTILITAS ===== */
function showToast(m,t){t=t||'success';var c=document.getElementById('toastContainer'),e=document.createElement('div');e.className='toast toast-'+t;e.innerHTML='<i class="fas fa-'+(t==='success'?'check-circle':t==='warning'?'exclamation-triangle':'times-circle')+' flex-shrink-0 mt-0.5"></i><span>'+m+'</span>';c.appendChild(e);setTimeout(function(){if(e.parentNode)e.remove()},5000)}
function closeModal(){document.getElementById('modalOverlay').classList.add('hidden');document.getElementById('modalBody').innerHTML=''}
function openModal(h){document.getElementById('modalOverlay').classList.remove('hidden');document.getElementById('modalBody').innerHTML=h}
function toggleSidebar(){var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay');s.classList.toggle('mobile-open');o.classList.toggle('active',s.classList.contains('mobile-open'))}
function closeSidebar(){document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('sidebarOverlay').classList.remove('active')}
function showAuthTab(t){document.getElementById('authLogin').classList.toggle('hidden',t!=='login');document.getElementById('authReg').classList.toggle('hidden',t!=='reg');document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabReg').classList.toggle('active',t==='reg')}
function onJenisChange(){var j=document.getElementById('rJenis').value,w=document.getElementById('rKelasWrap');if(j==='guru kelas'){w.style.display='block';document.getElementById('rKelas').disabled=false}else{w.style.display='none';document.getElementById('rKelas').disabled=true}}

function doGuruReg(){
  var npsn=document.getElementById('rNPSN').value.trim(),sekolah=document.getElementById('rSekolah').value.trim(),nip=document.getElementById('rNIP').value.trim(),nama=document.getElementById('rNama').value.trim(),jenis=document.getElementById('rJenis').value,kelas=document.getElementById('rKelas').value,rombel=document.getElementById('rRombel').value;
  if(!npsn||!sekolah||!nip||!nama||!jenis||!rombel){showToast('Semua field wajib diisi','error');return}
  if(jenis==='guru kelas'&&!kelas){showToast('Pilih kelas','error');return}
  if(nip.length<5){showToast('NIP tidak valid','error');return}
  showToast('Memeriksa NIP...','warning');
  Promise.all(KELAS_LIST.map(function(k){var db=getDB(k);if(!db)return Promise.resolve(null);return db.collection('guru').where('nip','==',nip).get().then(function(s){return s.empty?null:{kelas:k}}).catch(function(){return null})})).then(function(results){
    for(var i=0;i<results.length;i++){if(results[i]){showToast('NIP sudah terdaftar di database '+results[i].kelas+'!','error');return}}
    var targetKelas=kelas||'Kelas 1';var db=getDB(targetKelas);if(!db){showToast('Database error','error');return}
    db.collection('guru').add({npsn:npsn,sekolah:sekolah,nip:nip,nama:nama,jenis:jenis,kelas:kelas,rombel:rombel,active:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){showToast('Registrasi berhasil!');showAuthTab('login');document.getElementById('lNIP').value=nip}).catch(function(e){showToast('Gagal: '+e.message,'error')});
  });
}

function doGuruLogin(){
  var nip=document.getElementById('lNIP').value.trim();if(!nip){showToast('Masukkan NIP','error');return}
  showToast('Mencari...','warning');
  Promise.all(KELAS_LIST.map(function(k){var db=getDB(k);if(!db)return Promise.resolve(null);return db.collection('guru').where('nip','==',nip).limit(1).get().then(function(s){if(s.empty)return null;var d=s.docs[0].data();d._id=s.docs[0].id;d._db=k;return d}).catch(function(){return null})})).then(function(results){
    var found=null;for(var i=0;i<results.length;i++){if(results[i]){found=results[i];break}}
    if(!found){showToast('NIP tidak ditemukan. Daftar dulu.','error');return}
    /* FIX: Cek status aktif guru di koleksi teachers (admin) */
    var targetDB=found.jenis==='guru kelas'?found.kelas:'Kelas 1';
    var checkDB=getDB(targetDB);
    var guruFinal=found;
    if(checkDB){
      checkDB.collection('teachers').where('nip','==',nip).limit(1).get().then(function(ts){
        if(!ts.empty){
          var td=ts.docs[0].data();
          if(td.active===false){showToast('Akun dinonaktifkan oleh admin. Hubungi administrator.','error');return}
        }
        finishLogin(guruFinal);
      }).catch(function(){finishLogin(guruFinal)});
    }else{finishLogin(guruFinal)}
  });
}
function finishLogin(found){
  gData=found;activeClass=found.jenis==='guru kelas'?found.kelas:'Kelas 1';
  _lockLoaded=false;_featureLocks={};_globalLocks={};
  document.getElementById('authPage').style.display='none';document.getElementById('mainPage').classList.remove('hidden');
  document.getElementById('guruInfo').textContent=found.nama.substring(0,20);
  document.getElementById('headerGuru').textContent=found.nama;
  document.getElementById('headerKelas').textContent=found.jenis==='guru kelas'?found.kelas+' '+found.rombel:found.jenis.toUpperCase()+' '+found.rombel;
  navTo('dashboard');
  loadFeatureLocks();
  showToast('Selamat datang, '+found.nama);
}
function doLogout(){gData=null;activeClass='';_lockLoaded=false;_featureLocks={};_globalLocks={};document.getElementById('mainPage').classList.add('hidden');document.getElementById('authPage').style.display='';document.getElementById('lNIP').value='';showToast('Berhasil keluar')}

function navTo(page){
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active')});
  var t=document.querySelector('.nav-item[data-page="'+page+'"]');if(t)t.classList.add('active');
  var titles={dashboard:'Beranda','kelola-tp':'Kelola TP','bank-soal':'Bank Soal','print-soal':'Cetak Soal','print-kisi':'Kisi-Kisi','print-kunci':'Kunci Jawaban',pensekoran:'Pensekoran',koreksi:'Koreksi Nilai','cetak-nilai':'Cetak Nilai','data-siswa':'Data Siswa',token:'Token Ujian','kartu-login':'Kartu Login Siswa'};
  document.getElementById('pageTitle').textContent=titles[page]||'Beranda';

  /* CEK KUNCI SEBELUM RENDER HALAMAN */
  var lockType=isPageLocked(page);
  var c=document.getElementById('pageContent');

  if(lockType==='read'){
    c.innerHTML='<div class="fade-in">'+getLockBannerHTML(page,'read')+'</div>';
    return;
  }

  /* Render halaman normal, tapi sisipkan banner write-lock jika perlu */
  var writeLock=isPageLocked(WRITE_FEATURES[page]||'__none__');
  _currentWriteLock=writeLock;

  if(page==='dashboard')rDash(c);
  else if(page==='kelola-tp')rTP(c);
  else if(page==='bank-soal')rBank(c);
  else if(page==='print-soal')rPrintSoal(c);
  else if(page==='print-kisi')rKisi(c);
  else if(page==='print-kunci')rKunci(c);
  else if(page==='pensekoran')rSkor(c);
  else if(page==='koreksi')rKoreksi(c);
  else if(page==='cetak-nilai')rCetakNilai(c);
  else if(page==='data-siswa')rSiswa(c);
  else if(page==='token')rToken(c);
  else if(page==='kartu-login')rKartuLogin(c);
}
var _currentWriteLock=false;
document.getElementById('sidebarNav').addEventListener('click',function(e){var i=e.target.closest('.nav-item');if(i&&!i.classList.contains('locked-item'))navTo(i.dataset.page)});

function getGuruKelas(){if(!gData)return[];if(gData.jenis==='guru kelas')return[gData.kelas];return KELAS_LIST.slice()}
function getGuruRombel(){return gData?gData.rombel:'A'}

function filterBar(id){
  var h='<div class="grid md:grid-cols-2 gap-4 mb-4"><div><label class="text-xs text-muted block mb-1">Mapel</label><select id="'+id+'M" class="input-field" onchange="reload'+id+'()"><option value="">Semua Mapel</option>';
  MAPEL_LIST.forEach(function(m){h+='<option value="'+m.id+'">'+m.nama+'</option>'});
  h+='</select></div><div><label class="text-xs text-muted block mb-1">Kelas</label><select id="'+id+'K" class="input-field" onchange="reload'+id+'()"><option value="">Semua</option>';
  getGuruKelas().forEach(function(k){h+='<option value="'+k+'"'+(k===activeClass?' selected':'')+'>'+k+'</option>'});
  h+='</select></div></div>';return h;
}
function getFilter(p){return{mapel:document.getElementById(p+'M').value,kelas:document.getElementById(p+'K').value}}

function fetchSoal(mapel,kelas){
  var db=getDB(activeClass);if(!db)return Promise.resolve([]);
  var q=db.collection('questions');
  if(mapel)q=q.where('mapel','==',mapel);
  if(kelas)q=q.where('kelas','==',kelas);
  return q.get().then(function(s){var d=[];s.forEach(function(doc){d.push(doc.data())});return sByT(d,false)}).catch(function(){return[]});
}

/* FIX: fetchSiswaRombel sekarang bisa ambil dari koleksi 'students' (admin) atau 'siswa' (guru lama) */
function fetchSiswaRombel(){
  var db=getDB(activeClass);if(!db)return Promise.resolve([]);
  var rombel=getGuruRombel();
  var p1=db.collection('students').get().catch(function(){return{empty:true,forEach:function(){}}});
  var p2=db.collection('siswa').get().catch(function(){return{empty:true,forEach:function(){}}});
  return Promise.all([p1,p2]).then(function(results){
    var map={};
    /* Prioritas: koleksi 'students' dari admin (lebih lengkap) */
    results[0].forEach(function(doc){var t=doc.data();if(t.rombel===rombel&&t.active!==false)map[t.nisn||('_'+doc.id)]=t});
    /* Fallback: koleksi 'siswa' dari guru lama */
    results[1].forEach(function(doc){var t=doc.data();var key=t.nisn||('_'+doc.id);if(t.rombel===rombel&&!map[key])map[key]=t});
    var arr=[];for(var k in map)arr.push(map[k]);
    return arr.sort(function(a,b){return(a.nama||'').localeCompare(b.nama||'')});
  });
}

function fetchTokensGuru(){
  var db=getDB(activeClass);if(!db)return Promise.resolve([]);
  return db.collection('tokens').get().then(function(s){var d=[];s.forEach(function(doc){var t=doc.data();t._id=doc.id;d.push(t)});var nip=gData?gData.nip:'',rombel=getGuruRombel();d=d.filter(function(x){return x.guruNip===nip&&x.rombel===rombel});d.sort(function(a,b){return((b.createdAt||{}).seconds||0)-((a.createdAt||{}).seconds||0)});return d}).catch(function(){return[]});
}
function fetchNilai(mapel,kelas){
  var db=getDB(kelas||activeClass);if(!db)return Promise.resolve([]);
  return db.collection('nilai').get().then(function(s){var d=[];s.forEach(function(doc){d.push(doc.data())});var rombel=getGuruRombel();d=d.filter(function(x){return x.mapel===mapel&&x.rombel===rombel&&(!kelas||x.kelas===kelas)});return d.sort(function(a,b){return(a.nama||'').localeCompare(b.nama||'')})}).catch(function(){return[]});
}
function cekNISN(nisn){
  var db=getDB(activeClass);if(!db)return Promise.resolve(false);
  var rombel=getGuruRombel();
  return Promise.all([
    db.collection('students').get().catch(function(){return{forEach:function(){}}}),
    db.collection('siswa').get().catch(function(){return{forEach:function(){}}})
  ]).then(function(results){
    var dup=false;
    results[0].forEach(function(doc){var t=doc.data();if(t.nisn===nisn&&t.rombel===rombel)dup=true});
    results[1].forEach(function(doc){var t=doc.data();if(t.nisn===nisn&&t.rombel===rombel)dup=true});
    return dup;
  });
}

/* ===== SWITCH KELAS UNTUK PAI/PJOK + RELOAD LOCKS ===== */
document.addEventListener('change',function(e){
  if(e.target.id&&e.target.id.match(/^[a-z]+K$/)){
    var v=e.target.value;
    if(v&&getGuruKelas().indexOf(v)>-1){
      activeClass=v;
      document.getElementById('headerKelas').textContent=v+' '+getGuruRombel();
      _lockLoaded=false;_featureLocks={};_globalLocks={};
      loadFeatureLocks();
    }
  }
});

/* ==================== DASHBOARD ==================== */
function rDash(c){
  var h='<div class="fade-in space-y-6">';
  /* Info guru */
  h+='<div class="card border-kopAccent/30 bg-kopAccent/5"><div class="flex items-center gap-4 mb-4"><div class="w-14 h-14 rounded-full bg-gradient-to-br from-kopAccent to-yellow-600 flex items-center justify-center"><i class="fas fa-user text-kop text-xl"></i></div><div><h3 class="text-lg font-bold text-light">'+gData.nama+'</h3><p class="text-sm text-kopAccent font-semibold">'+gData.jenis.toUpperCase()+'</p><p class="text-xs text-muted">'+gData.sekolah+' &bull; NPSN: '+gData.npsn+'</p></div></div>';
  h+='<div class="grid grid-cols-2 md:grid-cols-4 gap-3"><div class="stat-box"><div class="text-xs text-muted">NIP</div><div class="text-sm font-bold text-light mt-1">'+gData.nip+'</div></div><div class="stat-box"><div class="text-xs text-muted">Kelas</div><div class="text-sm font-bold text-kopAccent mt-1">'+(gData.kelas||'1-5')+'</div></div><div class="stat-box"><div class="text-xs text-muted">Rombel</div><div class="text-sm font-bold text-info mt-1">'+gData.rombel+'</div></div><div class="stat-box"><div class="text-xs text-muted">Jenis</div><div class="text-sm font-bold text-warning mt-1">'+gData.jenis+'</div></div></div></div>';
  /* Status fitur yang dikunci */
  var lockedFeatures=[];
  for(var fid in _globalLocks){if(_globalLocks[fid]===true)lockedFeatures.push({id:fid,scope:'Global'});}
  for(var fid in _featureLocks){if(_featureLocks[fid]===true&&!_globalLocks[fid])lockedFeatures.push({id:fid,scope:'Per Guru'});}
  if(lockedFeatures.length>0){
    h+='<div class="card border-danger/30 bg-danger/5"><div class="flex items-center gap-3 mb-3"><i class="fas fa-exclamation-triangle text-danger"></i><h4 class="font-bold text-danger text-sm">'+lockedFeatures.length+' Fitur Dikunci</h4></div><div class="space-y-2">';
    var featNames={access_soal:'Bank Soal',create_soal:'Buat Soal',edit_soal:'Edit Soal',delete_soal:'Hapus Soal',access_tp:'Tujuan Pembelajaran',create_tp:'Buat TP',print_soal:'Cetak Soal',print_kisi:'Cetak Kisi-Kisi',print_kunci:'Cetak Kunci',pensekoran:'Pensekoran',access_siswa:'Data Siswa',manage_siswa:'Kelola Siswa'};
    lockedFeatures.forEach(function(lf){
      var nm=featNames[lf.id]||lf.id;
      h+='<div class="flex items-center justify-between p-2 rounded bg-dark/30"><span class="text-sm text-light">'+nm+'</span><span class="text-xs px-2 py-0.5 rounded '+(lf.scope==='Global'?'bg-kopAccent/15 text-kopAccent':'bg-danger/15 text-danger')+'">'+lf.scope+'</span></div>';
    });
    h+='</div><p class="text-xs text-muted mt-3"><i class="fas fa-info-circle mr-1"></i>Hubungi administrator untuk membuka akses fitur.</p></div>';
  }
  /* Statistik kelas */
  h+='<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">';
  getGuruKelas().forEach(function(k){
    h+='<div class="card text-center cursor-pointer hover:brightness-110 transition-all border-l-4 '+(k===activeClass?'border-kopAccent bg-kopAccent/5':'border-border bg-dark/20')+'" onclick="activeClass=\''+k+'\';navTo(\'bank-soal\')"><div class="text-xs text-muted uppercase mb-1">'+k+'</div><div class="text-xl font-bold '+(k===activeClass?'text-kopAccent':'text-light')+'">Rombel '+getGuruRombel()+'</div><div id="dashStat'+k.replace(/\s/g,'')+'" class="text-xs text-muted mt-1">...</div>'+(k===activeClass?'<div class="mt-2"><span class="pulse-dot bg-success inline-block mr-1"></span><span class="text-xs text-success font-bold">AKTIF</span></div>':'')+'</div>';
  });
  h+='</div></div>';c.innerHTML=h;
  getGuruKelas().forEach(function(k){var db=getDB(k);if(!db)return;db.collection('questions').get().then(function(s){var filtered=[];s.forEach(function(doc){var d=doc.data();if(d.kelas===k)filtered.push(d)});var el=document.getElementById('dashStat'+k.replace(/\s/g,''));if(el)el.textContent=filtered.length+' soal'}).catch(function(){})});
}

/* ==================== KELOLA TP ==================== */
function rTP(c){
  var wl=_currentWriteLock;
  var h='<div class="fade-in card">';
  h+='<div class="flex justify-between items-center mb-4"><h3 class="font-bold text-light">Kelola TP &mdash; <span class="text-kopAccent">'+activeClass+'</span></h3>';
  if(wl)h+='<span class="badge bg-danger/15 text-danger text-xs"><i class="fas fa-lock mr-1"></i>Hanya Baca</span>';
  else h+='<button onclick="openAddTP()" class="btn-primary text-sm"><i class="fas fa-plus mr-1"></i>Tambah</button>';
  h+='</div>';
  h+=getLockBannerHTML('kelola-tp',wl?'write':'')+(wl?'':filterBar('tp'));
  if(wl)h+='<div class="mb-4"><select id="tpM" class="input-field" onchange="reloadtp()"><option value="">Semua Mapel</option>'+MAPEL_LIST.map(function(m){return'<option value="'+m.id+'">'+m.nama+'</option>'}).join('')+'</select><select id="tpK" class="input-field mt-2" onchange="reloadtp()"><option value="">Semua</option>'+getGuruKelas().map(function(k){return'<option value="'+k+'"'+(k===activeClass?' selected':'')+'>'+k+'</option>'}).join('')+'</select></div>';
  h+='<div id="tpC" class="max-h-[65vh] overflow-y-auto pr-1"></div></div>';c.innerHTML=h;reloadtp();
}
function reloadtp(){
  var f={mapel:(document.getElementById('tpM')||{}).value,kelas:(document.getElementById('tpK')||{}).value};
  var db=getDB(activeClass),ct=document.getElementById('tpC');if(!db){ct.innerHTML='<p class="text-danger">DB error</p>';return}
  ct.innerHTML='<p class="text-muted text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i></p>';
  db.collection('tps').get().then(function(s){
    var docs=[];s.forEach(function(d){docs.push({id:d.id,data:d.data()})});docs=sByT(docs,true);
    if(f.mapel)docs=docs.filter(function(d){return d.data.mapel===f.mapel});
    if(f.kelas)docs=docs.filter(function(d){return d.data.kelas===f.kelas});
    if(!docs.length){ct.innerHTML='<p class="text-muted text-center py-8">Kosong.</p>';return}
    var wl=_currentWriteLock,h='';
    docs.forEach(function(d){var t=d.data,mn=(MAPEL_LIST.find(function(m){return m.id===t.mapel})||{}).nama||t.mapel;
      h+='<div class="p-3 bg-dark/40 rounded border-l-4 border-kopAccent mb-2"><div class="flex justify-between mb-1"><span class="text-xs font-bold text-kopAccent">'+mn+'</span><span class="text-xs text-muted">'+t.kelas+'</span></div><p class="text-sm text-light">'+t.text+'</p>';
      if(!wl)h+='<button onclick="delTP(\''+d.id+'\')" class="text-danger hover:text-white text-xs mt-2"><i class="fas fa-trash mr-1"></i>Hapus</button>';
      h+='</div>';
    });ct.innerHTML=h;

function reloadSiswa(){var db=getDB(activeClass),ct=document.getElementById('siswaC'),cari=(document.getElementById('cariSiswa')||{}).value||'';if(!db){ct.innerHTML='<p class="text-danger">DB error</p>';return}ct.innerHTML='<p class="text-muted text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i></p>';fetchSiswaRombel().then(function(docs){if(cari){var lc=cari.toLowerCase();docs=docs.filter(function(d){return(d.nama||'').toLowerCase().indexOf(lc)>-1||(d.nisn||'').toLowerCase().indexOf(lc)>-1})}if(!docs.length){ct.innerHTML='<p class="text-muted text-center py-8">Belum ada data siswa.</p>';return}var wl=_currentWriteLock,h='<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="bg-dark/60"><th class="p-2 text-left w-8">No</th><th class="p-2 text-left">NISN</th><th class="p-2 text-left">Nama</th><th class="p-2 text-left">Kelas</th><th class="p-2 text-center w-20">Aksi</th></tr></thead><tbody>';docs.forEach(function(d,i){h+='<tr class="border-t border-border hover:bg-dark/30"><td class="p-2 font-bold">'+(i+1)+'</td><td class="p-2 font-mono text-xs">'+(d.nisn||'-')+'</td><td class="p-2 font-semibold">'+(d.nama||'-')+'</td><td class="p-2 text-xs text-muted">'+d.kelas+' '+d.rombel+'</td><td class="p-2 text-center">'+(wl?'<span class="text-xs text-muted"><i class="fas fa-lock"></i></span>':'<button onclick="delSiswa(\''+d._id+'\')" class="text-danger hover:text-white text-xs"><i class="fas fa-trash"></i></button>')+'</td></tr>'});h+='</tbody></table></div><p class="text-xs text-muted mt-2">'+docs.length+' siswa</p>';ct.innerHTML=h}).catch(function(e){ct.innerHTML='<p class="text-danger p-4">'+e.message+'</p>'})}

function reloadToken(){var db=getDB(activeClass),ct=document.getElementById('tokenC');if(!db){ct.innerHTML='<p class="text-danger">DB error</p>';return}ct.innerHTML='<p class="text-muted text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i></p>';fetchTokensGuru().then(function(docs){if(!docs.length){ct.innerHTML='<div class="text-center py-8"><i class="fas fa-ticket-alt text-4xl text-muted mb-3"></i><p class="text-muted">Belum ada token.</p></div>';return}var h='<div class="token-row font-bold text-xs text-muted border-b-2 border-border"><span>No</span><span>Token</span><span class="hide-m">Mapel</span><span>Durasi</span><span>Status</span><span>Aksi</span></div>';docs.forEach(function(d,i){var st=d.startTime?d.startTime.toDate():null,en=d.endTime?d.endTime.toDate():null,nowMs=Date.now();var isActive=st&&en&&nowMs>=st.getTime()&&nowMs<=en.getTime();var isExpired=en&&nowMs>en.getTime();var isUpcoming=st&&nowMs<st.getTime();var badge=isActive?'<span class="text-xs px-2 py-0.5 rounded bg-success/20 text-success font-bold">AKTIF</span>':isExpired?'<span class="text-xs px-2 py-0.5 rounded bg-danger/20 text-danger font-bold">EXPIRED</span>':isUpcoming?'<span class="text-xs px-2 py-0.5 rounded bg-warning/20 text-warning font-bold">MENUNGGU</span>':'<span class="text-xs px-2 py-0.5 rounded bg-muted/20 text-muted">-</span>';var mn=(MAPEL_LIST.find(function(m){return m.id===d.mapel})||{}).nama||d.mapel;h+='<div class="token-row"><span class="font-bold">'+(i+1)+'</span><span class="font-mono font-bold text-kopAccent text-sm tracking-wider select-all">'+d.token+'</span><span class="hide-m text-xs text-muted">'+mn+'</span><span class="text-xs">'+d.durationMinutes+' menit</span><span>'+badge+'</span><span><button onclick="delToken(\''+d._id+'\')" class="text-danger hover:text-white text-xs"><i class="fas fa-trash"></i></button></span></div>'});ct.innerHTML=h}).catch(function(e){ct.innerHTML='<p class="text-danger p-4">'+e.message+'</p>'})}
function openGenToken(){var h='<h3 class="font-bold text-light mb-4">Buat Token Ujian</h3><div class="space-y-3"><div><label class="text-xs text-muted block mb-1">Mapel</label><select id="tkMapel" class="input-field">';MAPEL_LIST.forEach(function(m){h+='<option value="'+m.id+'">'+m.nama+'</option>'});h+='</select></div><div class="grid grid-cols-2 gap-4"><div><label class="text-xs text-muted block mb-1">Durasi (menit)</label><input type="number" id="tkDur" class="input-field" value="60" min="5" max="300"></div><div><label class="text-xs text-muted block mb-1">Kelas</label><input type="text" class="input-field" value="'+activeClass+'" readonly></div></div><div class="p-3 rounded-lg bg-dark/40 border border-border"><label class="text-xs text-muted block mb-1">Rombel</label><input type="text" class="input-field" value="'+getGuruRombel()+'" readonly></div></div><div class="mt-6 flex justify-end gap-3"><button onclick="closeModal()" class="btn-secondary">Batal</button><button onclick="genToken()" class="btn-primary"><i class="fas fa-key mr-2"></i>Generate Token</button></div>';openModal(h)}
function genToken(){var db=getDB(activeClass);if(!db){showToast('DB error','error');return}var mapel=document.getElementById('tkMapel').value,dur=parseInt(document.getElementById('tkDur').value)||60;if(!dur||dur<5){showToast('Durasi minimal 5 menit','error');return}var token=genTK(8);var now=new Date();db.collection('tokens').add({token:token,mapel:mapel,kelas:activeClass,rombel:getGuruRombel(),guruNip:gData.nip,guruNama:gData.nama,sekolah:gData.sekolah,startTime:firebase.firestore.Timestamp.fromDate(now),endTime:firebase.firestore.Timestamp.fromDate(new Date(now.getTime()+dur*60000)),durationMinutes:dur,isActive:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){showToast('Token: '+token+' ('+dur+' menit)');closeModal();reloadToken()}).catch(function(e){showToast('Gagal: '+e.message,'error')})}
function delToken(id){if(!confirm('Hapus token?'))return;getDB(activeClass).collection('tokens').doc(id).delete().then(function(){showToast('Dihapus');reloadToken()}).catch(function(){showToast('Gagal','error')})}

/* ==================== KARTU LOGIN SISWA ==================== */
var SAT_SISWA_URL='https://wetanskeren-lgtm.github.io/siswasatnew/';
function rKartuLogin(c){var h='<div class="fade-in no-print space-y-4"><div class="card"><h3 class="font-bold text-light mb-4">Kartu Login Siswa &mdash; <span class="text-kopAccent">'+activeClass+' '+getGuruRombel()+'</span></h3><div class="grid md:grid-cols-2 gap-4 mb-4"><div><label class="text-xs text-muted block mb-1">Kelas</label><select id="klK" class="input-field" onchange="loadKartu()"><option value="">Semua</option>';getGuruKelas().forEach(function(k){h+='<option value="'+k+'"'+(k===activeClass?' selected':'')+'>'+k+'</option>'});h+='</select></div><div class="flex items-end gap-2"><button onclick="loadKartu()" class="btn-primary text-sm flex-1"><i class="fas fa-id-card mr-2"></i>Tampilkan</button><button onclick="doCetakKartu()" class="btn-secondary text-sm"><i class="fas fa-print mr-2"></i>Cetak</button></div></div><div class="p-3 rounded-lg bg-info/10 border border-info/30 text-xs text-info"><i class="fas fa-info-circle mr-1"></i>Token tidak dicetak di kartu. Berikan token secara terpisah saat jadwal ujian melalui menu Token Ujian.</div></div><div id="klBox"></div></div>';c.innerHTML=h}
function generateBarcodeDataURL(text){return new Promise(function(resolve){try{var canvas=document.createElement('canvas');JsBarcode(canvas,text,{format:'CODE128',width:1.5,height:40,displayValue:false,margin:4,background:'#ffffff',lineColor:'#000000'});resolve(canvas.toDataURL('image/png'))}catch(e){resolve('')}})}
function loadKartu(){var kelas=document.getElementById('klK').value||activeClass;var box=document.getElementById('klBox');box.innerHTML='<p class="text-muted text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i></p>';fetchSiswaRombel().then(function(siswa){var filteredSiswa=kelas?siswa.filter(function(s){return s.kelas===kelas}):siswa;if(!filteredSiswa.length){box.innerHTML='<div class="card text-center py-8"><p class="text-muted">Tidak ada siswa.</p></div>';return}var siswaURL=SAT_SISWA_URL;generateBarcodeDataURL(siswaURL).then(function(barcodeSrc){var h='<div class="print-preview-wrap" id="kartuPreview"><div style="width:210mm"><div class="kartu-grid">';filteredSiswa.forEach(function(s){h+='<div class="kartu-item"><div class="kartu-header"><h3>Kartu Login SAT</h3><h4>'+gData.sekolah+'</h4></div><dl class="kartu-body"><dt>NPSN</dt><dd>: '+gData.npsn+'</dd><dt>Nama</dt><dd>: '+s.nama+'</dd><dt>NISN</dt><dd>: '+s.nisn+'</dd></dl><div class="kartu-barcode">';if(barcodeSrc)h+='<img src="'+barcodeSrc+'" alt="Barcode">';h+='<div class="barcode-url">'+siswaURL+'</div></div></div>'});h+='</div></div></div>';box.innerHTML=h})}).catch(function(e){box.innerHTML='<p class="text-danger p-4">'+e.message+'</p>'})}
function doCetakKartu(){var box=document.getElementById('kartuPreview');if(!box){showToast('Tampilkan kartu dulu','warning');return}printFrame(box.innerHTML)}

ate-columns:auto 1fr;gap:2px 8px;font-size:9pt}.kartu-item .kartu-body dt{font-weight:bold;white-space:nowrap}.kartu-item .kartu-body dd{margin:0}.kartu-item .kartu-barcode{margin-top:8px;text-align:center;padding-top:6px;border-top:1px dashed #999}.kartu-item .kartu-barcode img{max-width:100%;height:auto}.kartu-item .kartu-barcode .barcode-url{font-size:6.5pt;color:#555;margin-top:2px;word-break:break-all}</style></head><body>'+content+'</body></html>');d.close();setTimeout(function(){f.contentWindow.focus();f.contentWindow.print();setTimeout(function(){try{document.body.removeChild(f)}catch(e){}},3000)},600)}
</script>
